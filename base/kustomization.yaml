apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Generated by scripts/render-base.mjs from chart/ with default values.
# Overlays in ../overlays add a namespace and JSON patches on top of this.
resources:
  - configmap.yaml
  - deployment.yaml
  - hpa.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
  - servicemonitor.yaml
