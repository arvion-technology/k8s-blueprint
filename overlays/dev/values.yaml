# Helm values for the dev overlay. Image tag and replica count are applied as
# Kustomize patches below, so they are visible as release-specific changes rather
# than hidden in a values file.
environment: dev
config:
  logLevel: debug
ingress:
  host: webapp.dev.example.com
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
pdb:
  enabled: true
serviceMonitor:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
