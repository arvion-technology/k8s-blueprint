apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-prod
resources:
  - ../../base
patches:
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: webapp
  - path: patch-image.yaml
    target:
      kind: Deployment
      name: webapp
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: webapp
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: webapp
  - path: patch-hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: webapp
