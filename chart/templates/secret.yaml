{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-blueprint.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  API_TOKEN: "{{ .Values.secret.token }}"
{{- end }}
