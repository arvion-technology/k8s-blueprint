apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-blueprint.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Values.app.team }}
data:
  APP_ENV: {{ .Values.environment }}
  LOG_LEVEL: {{ .Values.config.logLevel }}
  FEATURE_FLAGS: "{{ .Values.config.featureFlags }}"
