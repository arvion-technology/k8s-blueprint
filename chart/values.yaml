# Default values. Every key is used by a template; there are no dead knobs.
# Overlays in ../overlays supply per-environment overrides, and a few of those
# also apply Kustomize JSON patches for values that belong to a release, not a
# chart default (image tag and replica count).

app:
  name: webapp
  team: platform

environment: dev

replicaCount: 2

image:
  repository: ghcr.io/arvion/webapp
  tag: "0.0.0-dev"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8080

config:
  logLevel: info
  featureFlags: "search,exports"

# A demo token only. Use an external secret store in a real cluster.
secret:
  enabled: true
  token: change-me

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /healthz
  readinessPath: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: webapp

ingress:
  enabled: true
  className: nginx
  host: webapp.example.com
  tls:
    enabled: true
    secretName: webapp-tls

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

tests:
  image:
    repository: busybox
    tag: "1.37.0"
